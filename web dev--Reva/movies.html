<!DOCTYPE html>
<html>
<head>
    <title>Movie Review Form</title>
<link rel="stylesheet" type="text/css" href="CSS/director.css">

</head>

<body>

    <h2>Fan Details</h2>

    <form>

        <label for="fanname">Fan Name:</label>
        <input type="text" id="fanname" name="fanname">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <h2>Movie Details</h2>

        <label for="movie">Select Movie:</label>
        <select id="movie" name="movie">
            <option value="kgf">KGF</option>
            <option value="kantara">Kantara</option>
            <option value="rrr">RRR</option>
            <option value="pushpa">Pushpa</option>
        </select>

        <br><br>

        <label>Rate the Movie:</label>
        <input type="radio" name="rating" value="1"> 1
        <input type="radio" name="rating" value="2"> 2
        <input type="radio" name="rating" value="3"> 3
        <input type="radio" name="rating" value="4"> 4
        <input type="radio" name="rating" value="5"> 5

        <br><br>

        <h2>Your Opinion</h2>

        <label>What did you like?</label>
        <br>

        <input type="checkbox" name="opinion" value="story"> Story
        <input type="checkbox" name="opinion" value="acting"> Acting
        <input type="checkbox" name="opinion" value="music"> Music
        <input type="checkbox" name="opinion" value="visual"> Visual Effects

        <br><br>

        <label for="review">Write your review:</label>
        <br>

        <textarea id="review" name="review" rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
<a href="2nd.html"> Home</a>

</body>
</html>
