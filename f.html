<!DOCTYPE html>
<html>
<head>
    <title>Booking Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">BookEasy</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Booking</a>
        <a href="#">Contact</a>
    </nav>
</header>

<h1>Booking Form</h1>

<div class="container">

    <div class="form">
        <h2>Book Now</h2>

        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Destination">
        <input type="date">

        <button>Book Now</button>
    </div>

    <div class="summary">
        <h2>Booking Summary</h2>
        <p>Name: John</p>
        <p>Destination: Bengaluru</p>
        <p>Guests: 2</p>
        <p>Total: ₹5000</p>
    </div>

</div>

<h2>Previous Bookings</h2>

<div class="table">
<table>
    <tr>
        <th>Name</th>
        <th>Destination</th>
        <th>Status</th>
    </tr>

    <tr>
        <td>John</td>
        <td>Bengaluru</td>
        <td>Confirmed</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>Mysuru</td>
        <td>Pending</td>
    </tr>
</table>
</div>

</body>
</html>
